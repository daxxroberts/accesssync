<!DOCTYPE html>
<html lang="en" data-mode="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AccessSync — Operator Dashboard: Administration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Brand — Indigo (logo, CTAs, AccessSync actions) */
      --brand:      #4F6EF7;
      --brand-dark: #3D5BD4;
      --brand-dim:  rgba(79,110,247,0.11);
      --brand-glow: rgba(79,110,247,0.22);

      /* ── Status — Sage (connected, positive, granted) */
      --sage:       #4ADE80;
      --sage-dark:  #22C55E;
      --sage-dim:   rgba(74,222,128,0.11);
      --sage-border:rgba(74,222,128,0.22);

      /* ── Semantic ── */
      --red:        #FF4D6A;
      --red-dim:    rgba(255,77,106,0.10);
      --amber:      #F5A623;
      --amber-dim:  rgba(245,166,35,0.10);

      /* ── Light mode (default) ── */
      --bg:         #F2F4F7;
      --surface:    #F9FAFB;
      --card:       #FFFFFF;
      --border:     #E2E5EA;
      --border2:    #D0D5DD;
      --text:       #1A2130;
      --text2:      #4A5568;
      --muted:      #8896A8;
      --shadow:     0 1px 4px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md:  0 4px 16px rgba(0,0,0,0.09);
    }

    [data-mode="dark"] {
      --bg:         #0D0F12;
      --surface:    #13161B;
      --card:       #1A1E25;
      --border:     #252B35;
      --border2:    #2E3644;
      --text:       #E8ECF2;
      --text2:      #8B96A8;
      --muted:      #4A5568;
      --shadow:     0 1px 4px rgba(0,0,0,0.3);
      --shadow-md:  0 4px 16px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      height: 52px;
      display: flex; align-items: center;
      padding: 0 18px;
      gap: 12px;
    }

    .logo {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .logo-mark { flex-shrink: 0; }
    .logo-text {
      font-size: 15px; font-weight: 700; letter-spacing: -0.3px;
      color: var(--text);
    }
    .logo-text span { color: var(--brand); }

    .topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }

    .sync-badge {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 500; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border);
    }
    .sync-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--sage); box-shadow: 0 0 5px var(--sage-dim);
      animation: pulse 2.5s infinite; flex-shrink: 0;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .icon-btn {
      width: 36px; height: 36px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; transition: all 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:hover { border-color: var(--border2); color: var(--text); }

    /* ── SUB-NAV ── */
    .sub-nav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex; align-items: center;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sub-nav-link {
      padding: 11px 14px;
      font-family: 'Sora', sans-serif;
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-decoration: none; border-bottom: 2px solid transparent;
      transition: all 0.15s; position: relative;
      white-space: nowrap;
    }
    .sub-nav-link:hover { color: var(--text2); }
    .sub-nav-link.active { color: var(--brand); border-bottom-color: var(--brand); }
    .sub-nav-badge {
      position: absolute; top: 5px; right: 0;
      min-width: 14px; height: 14px; padding: 0 4px;
      border-radius: 7px; background: var(--red);
      font-size: 8px; font-weight: 700; color: #fff;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }

    /* ── Content ── */
    .dash-content {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* ── Page header ── */
    .page-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }

    .page-title {
      font-size: 24px; font-weight: 700; color: var(--text);
      letter-spacing: -0.3px; margin-bottom: 4px;
    }

    .page-subtitle { font-size: 14px; color: var(--muted); line-height: 1.5; }


    /* ── Section card ── */
    .section-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
    }

    .section-title { font-size: 16px; font-weight: 700; color: var(--text); }

    .section-subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* ── Admin table ── */
    .admin-list { list-style: none; }

    .admin-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .admin-item:last-child { border-bottom: none; }

    .admin-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }

    .admin-avatar.owner { background: linear-gradient(135deg, var(--brand), #3D5BD4); }
    .admin-avatar.admin { background: var(--muted); }
    .admin-avatar.contributor { background: var(--muted); }

    .admin-info { flex: 1; min-width: 0; }
    .admin-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .admin-email { font-size: 12px; color: var(--muted); word-break: break-all; }

    .admin-role-badge {
      font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 5px;
      white-space: nowrap;
    }

    .admin-role-badge.owner { background: var(--brand-dim); color: var(--brand); }
    .admin-role-badge.admin { background: var(--surface); color: var(--text2); }
    .admin-role-badge.contributor { background: var(--surface); color: var(--text2); }

    .admin-actions {
      display: flex; gap: 6px; flex-shrink: 0;
    }

    .admin-action-btn {
      width: 32px; height: 32px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--card);
      cursor: pointer; font-size: 14px; color: var(--text2);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }

    .admin-action-btn:hover { background: var(--surface); color: var(--text); }


    /* ── Logged-in-as strip ── */
    .logged-in-strip {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 20px;
    }

    .logged-in-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--brand), #3D5BD4);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff;
    }

    .logged-in-info { flex: 1; }
    .logged-in-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .logged-in-detail { font-size: 11px; color: var(--muted); }

    .logged-in-badge {
      font-size: 10px; font-weight: 600;
      padding: 3px 8px; border-radius: 5px;
      background: var(--brand-dim); color: var(--brand);
    }

    /* ── Info toggle section ── */
    .info-toggle-btn {
      display: flex; align-items: center; gap: 6px;
      background: none; border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px;
      font-size: 12px; font-weight: 600; color: var(--muted);
      cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }

    .info-toggle-btn:hover { border-color: var(--border2); color: var(--text2); }

    .info-toggle-btn .chevron {
      font-size: 10px; transition: transform 0.2s;
      display: inline-block;
    }

    .info-toggle-btn.open .chevron { transform: rotate(180deg); }

    .info-body {
      max-height: 0; overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .info-body.open { max-height: 500px; }

    .info-content {
      padding-top: 16px;
    }

    .info-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--muted); line-height: 1.5;
    }

    .info-item:last-child { border-bottom: none; }

    .info-item-icon {
      font-size: 14px; flex-shrink: 0; margin-top: 1px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: #fff; padding: 12px 20px;
      border-radius: 10px; font-size: 13px; font-weight: 600;
      box-shadow: var(--shadow-md);
      z-index: 800; transition: transform 0.3s ease;
      display: flex; align-items: center; gap: 8px;
    }

    .toast.visible { transform: translateX(-50%) translateY(-80px); }
    .toast.success { border-left: 4px solid var(--sage-dark); }
    .toast.error { border-left: 4px solid var(--red); }
    .toast.info { border-left: 4px solid var(--brand); }

    /* ── Responsive — mobile-first ── */
    @media (max-width: 640px) {
      .page-title { font-size: 20px; }
      .page-header { flex-direction: column; }
      .admin-item { flex-wrap: wrap; }
    }

    @media (min-width: 640px) {
      .sub-nav { padding: 0 24px; }
      .topbar { padding: 0 28px; }
    }

    @media (min-width: 900px) {
      .topbar { padding: 0 32px; }
      .sub-nav { padding: 0 32px; }
      .dash-content { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="logo">
      <svg class="logo-mark" width="26" height="26" viewBox="0 0 28 28" fill="none">
        <rect x="5" y="13" width="18" height="13" rx="3" fill="var(--brand-dim)" stroke="var(--brand)" stroke-width="1.5"/>
        <path d="M9 13V10a5 5 0 0110 0v3" stroke="var(--brand)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M15.5 17l-3 4h3l-1.5 4 4-5.5h-3l1.5-2.5z" fill="var(--brand)"/>
      </svg>
      <span class="logo-text">Access<span>Sync</span></span>
    </div>
    <div class="topbar-right">
      <div class="sync-badge">
        <span class="sync-dot"></span>
        <span id="sync-label">Synced</span>
      </div>
      <button class="icon-btn" id="darkModeBtn" onclick="toggleDarkMode()" title="Toggle dark mode">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.3"/><path d="M7 1v1.5M7 11.5V13M1 7h1.5M11.5 7H13M2.6 2.6l1.1 1.1M10.3 10.3l1.1 1.1M2.6 11.4l1.1-1.1M10.3 3.7l1.1-1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- SUB-NAV -->
  <nav class="sub-nav" id="subNav"></nav>

  <div class="dash-content">
    <div class="page-header">
      <div>
        <div class="page-title">Administration</div>
        <div class="page-subtitle" id="pageSubtitle"></div>
      </div>
    </div>

    <!-- Logged-in-as strip -->
    <div class="logged-in-strip" id="loggedInStrip"></div>

    <!-- Current admins -->
    <div class="section-card">
      <div class="section-header">
        <div>
          <div class="section-title">Administrators</div>
          <div class="section-subtitle" id="adminCount"></div>
        </div>
      </div>
      <ul class="admin-list" id="adminList"></ul>
    </div>

    <!-- Collapsible info section -->
    <div class="section-card">
      <button class="info-toggle-btn" id="infoToggle" onclick="toggleInfo()">
        <span>&#9432;</span> How administrator access works <span class="chevron">&#9660;</span>
      </button>
      <div class="info-body" id="infoBody">
        <div class="info-content" id="infoContent"></div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ═══════════════════════════════════════
    // Platform config
    // ═══════════════════════════════════════
    var PLATFORM_CONFIG = { name: 'Kisi', groupLabel: 'Access Group' };
    function platformName() { return PLATFORM_CONFIG.name; }

    // ═══════════════════════════════════════
    // Demo data
    // ═══════════════════════════════════════

    var currentUser = { name: 'Daxx Roberts', email: 'daxxroberts@gmail.com', role: 'owner' };

    // Admins are pulled from Wix site roles — not managed within AccessSync
    var admins = [
      { id: 'a001', name: 'Daxx Roberts', email: 'daxxroberts@gmail.com', wixRole: 'Owner', lastAccess: 'Today, 10:42 AM' },
      { id: 'a002', name: 'Maria Chen', email: 'maria@example.com', wixRole: 'Admin', lastAccess: 'Mar 28, 2026' },
      { id: 'a003', name: 'Chad Roberts', email: 'chad@example.com', wixRole: 'Admin', lastAccess: 'Mar 25, 2026' },
    ];

    // ═══════════════════════════════════════
    // Dynamic messaging
    // ═══════════════════════════════════════

    function getPageSubtitle() {
      return admins.length + ' administrator' + (admins.length !== 1 ? 's' : '') + ' with access, validated through Wix site roles.';
    }

    // ═══════════════════════════════════════
    // Navigation
    // ═══════════════════════════════════════

    function getNavTabs() {
      var failedMembers = 2;
      var unlinkedPlans = 1;
      return [
        { label: 'Overview', href: 'dashboard-final.html', badge: 0, active: false },
        { label: 'Members', href: 'operator_members_page.html', badge: failedMembers, active: false },
        { label: 'Plan Mapping', href: 'operator_plan_setup_dashboard.html', badge: unlinkedPlans, active: false },
        { label: 'Access', href: 'operator_access_dashboard.html', badge: 0, active: false },
        { label: platformName() + ' Config', href: 'operator_locations.html', badge: 0, active: false },
        { label: 'Admin', href: 'operator_admin.html', badge: 0, active: true },
      ];
    }

    function renderNav() {
      var container = document.getElementById('subNav');
      container.innerHTML = '';
      getNavTabs().forEach(function(tab) {
        var a = document.createElement('a');
        a.href = tab.href;
        a.className = 'sub-nav-link' + (tab.active ? ' active' : '');
        a.textContent = tab.label;
        if (tab.badge > 0) {
          var badge = document.createElement('span');
          badge.className = 'sub-nav-badge';
          badge.textContent = tab.badge;
          a.appendChild(badge);
        }
        container.appendChild(a);
      });
    }

    // ═══════════════════════════════════════
    // Render
    // ═══════════════════════════════════════

    function renderLoggedIn() {
      var el = document.getElementById('loggedInStrip');
      var initials = currentUser.name.split(' ').map(function(n) { return n[0]; }).join('');
      el.innerHTML =
        '<div class="logged-in-avatar">' + initials + '</div>' +
        '<div class="logged-in-info">' +
          '<div class="logged-in-name">' + currentUser.name + '</div>' +
          '<div class="logged-in-detail">Signed in via Wix · ' + currentUser.email + '</div>' +
        '</div>' +
        '<div class="logged-in-badge">' + currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1) + '</div>';
    }

    function renderAdmins() {
      var el = document.getElementById('adminList');
      document.getElementById('adminCount').textContent = 'Synced from Wix site roles · ' + admins.length + ' administrator' + (admins.length !== 1 ? 's' : '');

      el.innerHTML = admins.map(function(a) {
        var initials = a.name.split(' ').map(function(n) { return n[0]; }).join('');
        var isOwner = a.wixRole === 'Owner';
        var avatarClass = isOwner ? 'owner' : 'admin';
        var isCurrentUser = a.email === currentUser.email;

        var youTag = isCurrentUser ? ' <span style="font-size:11px;color:var(--muted);">(You)</span>' : '';

        return '<li class="admin-item">' +
          '<div class="admin-avatar ' + avatarClass + '">' + initials + '</div>' +
          '<div class="admin-info">' +
            '<div class="admin-name">' + a.name + youTag + '</div>' +
            '<div class="admin-email">' + a.email + ' · Last access: ' + a.lastAccess + '</div>' +
          '</div>' +
          '<span class="admin-role-badge ' + (isOwner ? 'owner' : 'admin') + '">Wix ' + a.wixRole + '</span>' +
        '</li>';
      }).join('');
    }

    function renderInfoSection() {
      var items = [
        { icon: '&#128274;', text: 'Administrator access is determined by your Wix site roles. Any member with an Owner or Admin role automatically has access to this dashboard.' },
        { icon: '&#128100;', text: 'When a Wix site member navigates to AccessSync, their session is validated automatically — no separate login required.' },
        { icon: '&#9881;', text: 'To add or remove administrators, manage their roles directly in your Wix site dashboard under Site Members.' },
      ];

      document.getElementById('infoContent').innerHTML = items.map(function(item) {
        return '<div class="info-item">' +
          '<span class="info-item-icon">' + item.icon + '</span>' +
          '<span>' + item.text + '</span>' +
        '</div>';
      }).join('');
    }

    function toggleInfo() {
      var btn = document.getElementById('infoToggle');
      var body = document.getElementById('infoBody');
      btn.classList.toggle('open');
      body.classList.toggle('open');
    }

    // ═══════════════════════════════════════
    // Toast
    // ═══════════════════════════════════════

    var toastTimer;
    function showToast(type, msg) {
      var t = document.getElementById('toast');
      var icons = { success: '&#10003;', error: '&#10005;', info: '&#8505;' };
      t.className = 'toast ' + type;
      t.innerHTML = (icons[type] || '') + ' ' + msg;
      t.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { t.classList.remove('visible'); }, 3000);
    }

    // ═══════════════════════════════════════
    // Dark mode
    // ═══════════════════════════════════════

    function toggleDarkMode() {
      var html = document.documentElement;
      var currentMode = html.getAttribute('data-mode');
      var newMode = currentMode === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-mode', newMode);
      localStorage.setItem('accesssync-dark-mode', newMode);
    }

    // Load dark mode preference
    (function() {
      var savedMode = localStorage.getItem('accesssync-dark-mode') || 'light';
      document.documentElement.setAttribute('data-mode', savedMode);
    })();

    // ═══════════════════════════════════════
    // Init
    // ═══════════════════════════════════════

    renderNav();
    renderLoggedIn();
    renderAdmins();
    renderInfoSection();
    document.getElementById('pageSubtitle').textContent = getPageSubtitle();
  </script>
</body>
</html>
