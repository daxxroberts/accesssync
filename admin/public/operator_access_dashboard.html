<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Dashboard — AccessSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --brand: #4F6EF7;
      --brand-dark: #3D5BD4;
      --brand-dim: rgba(79, 110, 247, 0.11);
      --brand-glow: rgba(79, 110, 247, 0.22);
      --sage: #4ADE80;
      --sage-dark: #22C55E;
      --sage-dim: rgba(74, 222, 128, 0.11);
      --sage-border: rgba(74, 222, 128, 0.22);
      --red: #FF4D6A;
      --red-dim: rgba(255, 77, 106, 0.10);
      --amber: #F5A623;
      --amber-dim: rgba(245, 166, 35, 0.10);
      --bg: #F2F4F7;
      --surface: #F9FAFB;
      --card: #FFFFFF;
      --border: #E2E5EA;
      --border2: #D0D5DD;
      --text: #1A2130;
      --text2: #4A5568;
      --muted: #8896A8;
      --shadow: 0 1px 4px rgba(0, 0, 0, 0.07), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.09);
    }

    [data-mode="dark"] {
      --bg: #0D0F12;
      --surface: #13161B;
      --card: #1A1E25;
      --border: #252B35;
      --border2: #2E3644;
      --text: #E8ECF2;
      --text2: #8B96A8;
      --muted: #4A5568;
      --shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background-color 0.3s, color 0.3s;
    }

    /* Topbar */
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .sync-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text2);
      font-weight: 500;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sage);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #mode-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text);
      transition: color 0.3s;
      padding: 4px 8px;
    }

    #mode-btn:hover {
      color: var(--brand);
    }

    /* Sub-nav */
    .sub-nav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .sub-nav-link {
      padding: 11px 14px;
      font-family: 'Sora', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      position: relative;
      white-space: nowrap;
    }

    .sub-nav-link:hover {
      color: var(--text2);
    }

    .sub-nav-link.active {
      color: var(--brand);
      border-bottom-color: var(--brand);
    }

    .sub-nav-badge {
      position: absolute;
      top: 5px;
      right: 0;
      min-width: 14px;
      height: 14px;
      padding: 0 4px;
      border-radius: 7px;
      background: var(--red);
      font-size: 8px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* Main container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* Breadcrumb & header */
    .page-header {
      margin-bottom: 24px;
    }

    .breadcrumb {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 12px;
    }

    .breadcrumb a {
      color: var(--brand);
      text-decoration: none;
      transition: color 0.2s;
    }

    .breadcrumb a:hover {
      color: var(--brand-dark);
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--text2);
    }

    /* Stats strip */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    /* Card wrapper */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .card-header {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
    }

    /* Chart container */
    .chart-container {
      height: 300px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      margin-bottom: 20px;
      position: relative;
    }

    .bar-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      min-height: 100%;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .bar-wrapper:hover {
      transform: translateY(-4px);
    }

    .bar {
      width: 100%;
      background: var(--brand);
      border-radius: 4px 4px 0 0;
      transition: all 0.3s;
      position: relative;
    }

    .bar:hover::after {
      content: attr(data-value);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      margin-bottom: 4px;
      z-index: 10;
    }

    .bar.filtered {
      opacity: 0.3;
    }

    .chart-labels {
      display: flex;
      gap: 4px;
      margin-top: 12px;
      align-items: flex-start;
      justify-content: space-between;
    }

    .chart-label {
      flex: 1;
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
    }

    /* Filter tags */
    .filter-strip {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-tag {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-tag:hover {
      border-color: currentColor;
    }

    .filter-tag.active {
      color: #fff;
      border-color: transparent;
    }

    .filter-tag.all.active {
      background: var(--brand);
    }

    .filter-tag.granted.active {
      background: var(--sage);
    }

    .filter-tag.provisioned.active {
      background: var(--brand);
    }

    .filter-tag.revoked.active {
      background: var(--red);
    }

    .filter-tag.error.active {
      background: var(--red);
    }

    .filter-tag.denied.active {
      background: var(--amber);
    }

    /* Activity grid */
    .activity-grid {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .grid-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .grid-table thead {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
    }

    .grid-table th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 700;
      color: var(--text);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .grid-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text2);
    }

    .grid-table tbody tr:nth-child(even) {
      background: var(--surface);
    }

    .grid-table tbody tr:hover {
      background: var(--brand-dim);
    }

    .event-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .event-tag.granted {
      background: var(--sage-dim);
      color: var(--sage-dark);
    }

    .event-tag.provisioned {
      background: var(--brand-dim);
      color: var(--brand-dark);
    }

    .event-tag.revoked {
      background: var(--red-dim);
      color: var(--red);
    }

    .event-tag.error {
      background: var(--red-dim);
      color: var(--red);
    }

    .event-tag.denied {
      background: var(--amber-dim);
      color: var(--amber);
    }

    .location-text {
      color: var(--text2);
      font-size: 12px;
    }

    .load-more-btn {
      display: block;
      margin: 24px auto 0;
      padding: 12px 24px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Sora', sans-serif;
    }

    .load-more-btn:hover {
      background: var(--brand-dark);
      box-shadow: var(--shadow-md);
    }

    .load-more-btn:active {
      transform: scale(0.98);
    }

    .load-more-btn.hidden {
      display: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 16px 12px;
      }

      .page-title {
        font-size: 22px;
      }

      .stats-strip {
        grid-template-columns: repeat(2, 1fr);
      }

      .chart-container {
        height: 200px;
      }

      .chart-label {
        font-size: 9px;
      }

      .filter-strip {
        gap: 6px;
      }

      .filter-tag {
        padding: 6px 12px;
        font-size: 12px;
      }

      .grid-table th,
      .grid-table td {
        padding: 10px 12px;
        font-size: 12px;
      }

      .topbar {
        padding: 12px 16px;
      }
    }

    @media (max-width: 480px) {
      .topbar-left {
        gap: 8px;
      }

      .logo-text {
        display: none;
      }

      .stats-strip {
        grid-template-columns: 1fr;
      }

      .chart-container {
        height: 150px;
        gap: 2px;
      }

      .filter-tag {
        padding: 6px 10px;
        font-size: 11px;
      }

      .grid-table th,
      .grid-table td {
        padding: 8px 10px;
        font-size: 11px;
      }

      .page-title {
        font-size: 20px;
      }
    }
  </style>
</head>

        var activeClass = tab.active ? ' active' : '';
        var badgeHtml = tab.badge > 0 ? '<span class="sub-nav-badge">' + tab.badge + '</span>' : '';
        html += '<a href="' + tab.href + '" class="sub-nav-link' + activeClass + '">' + tab.label + badgeHtml + '</a>';
      });

      document.getElementById('sub-nav').innerHTML = html;
    }

    // Initialize location filter
    function initLocationFilter() {
      var locations = [
        { label: 'All Locations', value: 'all' },
        { label: 'Fort Smith — Main', value: 'fort-smith' },
        { label: 'Roland — Annex', value: 'roland' }
      ];

      var html = '';
      locations.forEach(function(loc) {
        var activeClass = loc.value === currentLocation ? ' active' : '';
        html += '<button class="filter-tag' + activeClass + '" onclick="filterByLocation(\'' + loc.value + '\')">' + loc.label + '</button>';
      });

      document.getElementById('location-filter-strip').innerHTML = html;
    }

    // Filter by location
    function filterByLocation(location) {
      currentLocation = location;
      currentPage = 1;

      // Update active location
      var tags = document.querySelectorAll('#location-filter-strip .filter-tag');
      tags.forEach(function(t) {
        t.classList.remove('active');
      });
      event.target.classList.add('active');

      // Update stats
      updateStats();

      // Update grid
      renderActivityGrid();
    }

    // Update stats based on location
    function updateStats() {
      var filtered = allActivities;
      if (currentLocation !== 'all') {
        filtered = filtered.filter(function(act) {
          return act.locationId === currentLocation;
        });
      }

      var totalEvents = filtered.length;
      var dailyAverage = Math.round(totalEvents / 30);
      var errorCount = filtered.filter(function(act) { return act.event === 'error'; }).length;
      var errorRate = totalEvents > 0 ? ((errorCount / totalEvents) * 100).toFixed(1) : '0';

      document.querySelectorAll('.stat-value')[0].textContent = totalEvents.toLocaleString();
      document.querySelectorAll('.stat-value')[1].textContent = dailyAverage;
      document.querySelectorAll('.stat-value')[3].textContent = errorRate + '%';
    }

    // Initialize chart
    function initChart() {
      var maxValue = Math.max.apply(null, chartData);
      var chartHtml = '';
      var labelsHtml = '';

      chartData.forEach(function(val, idx) {
        var height = (val / maxValue) * 100;
        chartHtml += '<div class="bar-wrapper"><div class="bar" data-value="' + val + '" style="height: ' + height + '%"></div></div>';
        var hour = idx === 0 ? '12am' : idx < 12 ? idx + 'am' : idx === 12 ? '12pm' : (idx - 12) + 'pm';
        labelsHtml += '<div class="chart-label">' + hour + '</div>';
      });

      document.getElementById('chart-container').innerHTML = chartHtml;
      document.getElementById('chart-labels').innerHTML = labelsHtml;
    }

    // Initialize filter tags
    function initFilterTags() {
      var filters = [
        { label: 'All', value: 'all', class: 'all' },
        { label: 'Access Granted', value: 'granted', class: 'granted' },
        { label: 'Access Provisioned', value: 'provisioned', class: 'provisioned' },
        { label: 'Access Revoked', value: 'revoked', class: 'revoked' },
        { label: 'Error', value: 'error', class: 'error' },
        { label: 'Access Denied', value: 'denied', class: 'denied' },
      ];

      var html = '';
      filters.forEach(function(filter) {
        var activeClass = filter.value === 'all' ? ' active' : '';
        html += '<button class="filter-tag ' + filter.class + activeClass + '" onclick="filterByTag(\'' + filter.value + '\')">' + filter.label + '</button>';
      });

      document.getElementById('filter-strip').innerHTML = html;
    }

    // Filter by tag
    function filterByTag(tag) {
      currentFilter = tag;
      currentPage = 1;

      // Update active tag
      var tags = document.querySelectorAll('.filter-tag');
      tags.forEach(function(t) {
        t.classList.remove('active');
      });
      event.target.classList.add('active');

      // Update chart
      var bars = document.querySelectorAll('.bar');
      if (tag === 'all') {
        bars.forEach(function(bar) {
          bar.classList.remove('filtered');
        });
      } else {
        bars.forEach(function(bar) {
          bar.classList.add('filtered');
        });
      }

      // Update grid
      renderActivityGrid();
    }

    // Render activity grid
    function renderActivityGrid() {
      var filtered = allActivities;
      if (currentFilter !== 'all') {
        filtered = filtered.filter(function(act) {
          return act.event === currentFilter;
        });
      }
      if (currentLocation !== 'all') {
        filtered = filtered.filter(function(act) {
          return act.locationId === currentLocation;
        });
      }

      var start = (currentPage - 1) * itemsPerPage;
      var end = start + itemsPerPage;
      var page = filtered.slice(start, end);

      var html = '';
      page.forEach(function(act) {
        html += '<tr>';
        html += '<td>' + act.date + ', ' + act.time + '</td>';
        html += '<td>' + act.member + '</td>';
        html += '<td><span class="event-tag ' + act.event + '">' + capitalize(act.event.replace(/_/g, ' ')) + '</span></td>';
        html += '<td>' + act.plan + '</td>';
        html += '<td><span class="location-text">' + act.location + '</span></td>';
        html += '<td>' + act.details + '</td>';
        html += '</tr>';
      });

      document.getElementById('activity-tbody').innerHTML = html;

      // Show/hide load more
      var btn = document.getElementById('load-more-btn');
      if (end >= filtered.length) {
        btn.classList.add('hidden');
      } else {
        btn.classList.remove('hidden');
      }
    }

    // Load more
    function loadMore() {
      currentPage++;
      renderActivityGrid();
    }

    // Toggle dark mode
    function toggleMode() {
      var html = document.documentElement;
      var isDark = html.getAttribute('data-mode') === 'dark';
      if (isDark) {
        html.removeAttribute('data-mode');
        document.getElementById('mode-btn').textContent = '🌙';
      } else {
        html.setAttribute('data-mode', 'dark');
        document.getElementById('mode-btn').textContent = '☀️';
      }
    }

    // Capitalize
    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // Initialize
    (function() {
      var params = new URLSearchParams(window.location.search);
      var location = params.get('location');
      if (location === 'fort-smith') {
        currentLocation = 'fort-smith';
      } else if (location === 'roland') {
        currentLocation = 'roland';
      }
    })();

    initSubNav();
    initLocationFilter();
    initChart();
    initFilterTags();
    updateStats();
    renderActivityGrid();
  </script>

</body>
</html>
