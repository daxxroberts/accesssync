<!DOCTYPE html>
<html lang="en" data-mode="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AccessSync — Operator Dashboard: Members</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Brand — Indigo (logo, CTAs, AccessSync actions) */
      --brand:      #4F6EF7;
      --brand-dark: #3D5BD4;
      --brand-dim:  rgba(79,110,247,0.11);
      --brand-glow: rgba(79,110,247,0.22);

      /* ── Status — Sage (connected, positive, granted) */
      --sage:       #4ADE80;
      --sage-dark:  #22C55E;
      --sage-dim:   rgba(74,222,128,0.11);
      --sage-border:rgba(74,222,128,0.22);

      /* ── Semantic ── */
      --red:        #FF4D6A;
      --red-dim:    rgba(255,77,106,0.10);
      --amber:      #F5A623;
      --amber-dim:  rgba(245,166,35,0.10);

      /* ── Light mode (default) ── */
      --bg:         #F2F4F7;
      --surface:    #F9FAFB;
      --card:       #FFFFFF;
      --border:     #E2E5EA;
      --border2:    #D0D5DD;
      --text:       #1A2130;
      --text2:      #4A5568;
      --muted:      #8896A8;
      --shadow:     0 1px 4px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md:  0 4px 16px rgba(0,0,0,0.09);
    }

    [data-mode="dark"] {
      --bg:         #0D0F12;
      --surface:    #13161B;
      --card:       #1A1E25;
      --border:     #252B35;
      --border2:    #2E3644;
      --text:       #E8ECF2;
      --text2:      #8B96A8;
      --muted:      #4A5568;
      --shadow:     0 1px 4px rgba(0,0,0,0.3);
      --shadow-md:  0 4px 16px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* ══════════════════════════════
       TOPBAR
    ══════════════════════════════ */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      height: 52px;
      display: flex; align-items: center;
      padding: 0 18px;
      gap: 12px;
    }

    .logo {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .logo-mark { flex-shrink: 0; }
    .logo-text {
      font-size: 15px; font-weight: 700; letter-spacing: -0.3px;
      color: var(--text);
    }
    .logo-text span { color: var(--brand); }

    /* Mobile client name */
    .mobile-client {
      flex: 1; font-size: 13px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }

    .sync-badge {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 500; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border);
    }
    .sync-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--sage); box-shadow: 0 0 5px var(--sage-dim);
      animation: pulse 2.5s infinite; flex-shrink: 0;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .icon-btn {
      width: 36px; height: 36px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; transition: all 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:hover { border-color: var(--border2); color: var(--text); }

    /* Role toggle */
    .role-toggle {
      display: flex; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px; gap: 2px; flex-shrink: 0;
    }
    .role-btn {
      padding: 3px 10px; border-radius: 20px;
      font-family: 'Sora', sans-serif; font-size: 10px; font-weight: 600;
      cursor: pointer; border: none; background: transparent;
      color: var(--muted); transition: all 0.15s; white-space: nowrap;
    }
    .role-btn.active { background: var(--brand); color: #fff; }

    /* ══════════════════════════════
       SUB-NAV
    ══════════════════════════════ */
    .sub-nav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex; align-items: center;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sub-nav-link {
      padding: 11px 14px;
      font-family: 'Sora', sans-serif;
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-decoration: none; border-bottom: 2px solid transparent;
      transition: all 0.15s; position: relative;
      white-space: nowrap;
    }
    .sub-nav-link:hover { color: var(--text2); }
    .sub-nav-link.active { color: var(--brand); border-bottom-color: var(--brand); }
    .sub-nav-badge {
      position: absolute; top: 5px; right: 0;
      min-width: 14px; height: 14px; padding: 0 4px;
      border-radius: 7px; background: var(--red);
      font-size: 10px; font-weight: 700; color: #fff;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }

    /* ── Content ── */
    .dash-content {
      max-width: 1020px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* ── Page header ── */
    .page-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
    }

    .page-header-left { }

    .page-title {
      font-size: 24px; font-weight: 700; color: var(--text);
      letter-spacing: -0.3px; margin-bottom: 4px;
    }

    .page-subtitle { font-size: 14px; color: var(--muted); line-height: 1.5; }

    /* ── Stats strip ── */
    .stats-strip {
      display: flex; gap: 12px; flex-wrap: wrap;
    }

    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 18px;
      min-width: 130px; cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .stat-card:hover { border-color: var(--border2); box-shadow: var(--shadow); }
    .stat-card.selected { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-dim); }

    .stat-value { font-size: 22px; font-weight: 700; color: var(--text); }
    .stat-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

    .stat-card.alert .stat-value { color: var(--red); }
    .stat-card.alert.selected { border-color: var(--red); box-shadow: 0 0 0 2px var(--red-dim); }

    /* ── Filters bar ── */
    .filters-bar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; flex-wrap: wrap;
    }

    .filter-select {
      padding: 8px 32px 8px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 13px; font-family: inherit;
      color: var(--text); background: var(--card); outline: none;
      cursor: pointer; appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238896A8' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      transition: border-color 0.15s;
    }

    .filter-select:focus { border-color: var(--brand); }

    .filter-search {
      padding: 8px 12px 8px 32px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 13px; font-family: inherit;
      color: var(--text); background: var(--card); outline: none;
      min-width: 220px; transition: border-color 0.15s;
      background-image: url("data:image/svg+xml,%3Csvg width='14' height='14' viewBox='0 0 14 14' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='6' cy='6' r='4.5' stroke='%238896A8' stroke-width='1.5'/%3E%3Cpath d='M9.5 9.5L12.5 12.5' stroke='%238896A8' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: 10px center;
    }

    .filter-search:focus { border-color: var(--brand); }

    .filter-clear {
      font-size: 12px; font-weight: 600; color: var(--brand);
      background: none; border: none; cursor: pointer;
      padding: 8px 6px; display: none;
    }

    .filter-clear.visible { display: inline; }
    .filter-clear:hover { text-decoration: underline; }

    .filter-count {
      font-size: 12px; color: var(--muted); margin-left: auto;
    }

    /* ── Active filter badge ── */
    .active-filter {
      display: none; align-items: center; gap: 8px;
      background: var(--brand-dim); border: 1px solid var(--brand-dim);
      border-radius: 8px; padding: 8px 14px;
      margin-bottom: 16px; font-size: 13px; color: var(--brand);
    }

    .active-filter.visible { display: flex; }

    .active-filter strong { font-weight: 700; }

    .active-filter-close {
      margin-left: auto; background: none; border: none;
      cursor: pointer; font-size: 16px; color: var(--brand);
      padding: 0 4px; line-height: 1;
    }

    .active-filter-close:hover { color: var(--brand-dark); }

    /* ── Members table ── */
    .members-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }

    .members-tbl {
      width: 100%; border-collapse: collapse;
    }

    .members-tbl th {
      text-align: left; font-size: 10px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .members-tbl td {
      padding: 12px 16px; font-size: 13px; color: var(--text);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .members-tbl tbody tr {
      transition: background 0.12s;
    }

    .members-tbl tbody tr:hover { background: var(--surface); }
    .members-tbl tbody tr:last-child td { border-bottom: none; }

    .members-tbl tbody tr.is-holder { background: var(--surface); }
    .members-tbl tbody tr.is-holder:hover { background: var(--surface); }

    /* ── Member cell elements ── */
    .member-cell {
      display: flex; align-items: center; gap: 10px;
    }

    .member-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
    }

    .member-avatar.holder { background: linear-gradient(135deg, #1B3A5C, #2E5D8A); }
    .member-avatar.active { background: linear-gradient(135deg, var(--sage-dark), #22c55e); }
    .member-avatar.pending { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .member-avatar.failed { background: linear-gradient(135deg, var(--red), #ef4444); }
    .member-avatar.suspended { background: linear-gradient(135deg, #6b7280, #9ca3af); }

    .member-name { font-weight: 600; }
    .member-email { font-size: 12px; color: var(--muted); margin-top: 1px; }

    .member-tag {
      display: inline-block; font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      padding: 2px 6px; border-radius: 4px;
      margin-left: 6px; vertical-align: middle;
    }

    .member-tag.holder { color: var(--brand); background: var(--brand-dim); }
    .member-tag.sub { color: var(--text2); background: var(--surface); }

    .status-pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
    }

    .status-pill.active { background: var(--sage-dim); color: var(--sage-dark); }
    .status-pill.pending { background: var(--amber-dim); color: var(--amber); }
    .status-pill.failed { background: var(--red-dim); color: var(--red); }
    .status-pill.suspended { background: var(--surface); color: var(--muted); }

    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
    }

    .status-pill.active .status-dot { background: var(--sage-dark); }
    .status-pill.pending .status-dot { background: var(--amber); animation: pulse 1.4s ease-in-out infinite; }
    .status-pill.failed .status-dot { background: var(--red); }
    .status-pill.suspended .status-dot { background: var(--muted); }

    .plan-badge {
      font-size: 11px; font-weight: 600; color: var(--text);
    }

    .plan-badge-sub {
      font-size: 11px; color: var(--muted);
    }

    /* ── Action buttons ── */
    .tbl-action-btn {
      width: 28px; height: 28px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--muted); font-size: 12px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all 0.12s; margin-left: 4px;
    }

    .tbl-action-btn:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-dim); }
    .tbl-action-btn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }
    .tbl-action-btn.retry:hover { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }

    /* ── Additional member indent ── */
    .sub-indent {
      padding-left: 42px;
    }

    .sub-connector {
      display: inline-block; width: 16px; height: 16px;
      border-left: 2px solid var(--border); border-bottom: 2px solid var(--border);
      border-radius: 0 0 0 6px; margin-right: 8px;
      vertical-align: middle; position: relative; top: -2px;
    }

    /* ── Expand/collapse holder row ── */
    .expand-btn {
      width: 22px; height: 22px; border-radius: 5px;
      border: 1px solid var(--border); background: var(--surface);
      cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center;
      font-size: 10px; color: var(--muted);
      transition: all 0.12s; margin-right: 8px;
      flex-shrink: 0;
    }

    .expand-btn:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-dim); }
    .expand-btn.open { transform: rotate(90deg); }

    /* ── Empty state ── */
    .empty-row td {
      text-align: center; padding: 40px 16px;
      color: var(--muted); font-size: 14px;
    }

    /* ── Pagination ── */
    .pagination {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .page-info { font-size: 12px; color: var(--muted); }

    .page-btns { display: flex; gap: 4px; }

    .page-btn {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      font-size: 12px; font-weight: 600; color: var(--text2);
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 0.12s;
    }

    .page-btn:hover { border-color: var(--brand); color: var(--brand); }
    .page-btn.active { border-color: var(--brand); background: var(--brand); color: #fff; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Detail drawer ── */
    .drawer-overlay {
      display: none; position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      background: rgba(0,0,0,0.3);
      z-index: 500;
    }

    .drawer-overlay.visible { display: block; }

    .drawer {
      position: fixed; top: 0; right: -480px; bottom: 0;
      width: 460px; max-width: 100vw;
      background: var(--card); box-shadow: -8px 0 32px rgba(0,0,0,0.12);
      z-index: 600; transition: right 0.25s ease;
      display: flex; flex-direction: column;
    }

    .drawer.open { right: 0; }

    .drawer-header {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }

    .drawer-title { font-size: 18px; font-weight: 700; color: var(--text); }

    .drawer-close {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      cursor: pointer; font-size: 16px; color: var(--text2);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s;
    }

    .drawer-close:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }

    .drawer-body {
      flex: 1; overflow-y: auto; padding: 20px 24px;
    }

    .drawer-section-label {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 10px; margin-top: 20px;
    }

    .drawer-section-label:first-child { margin-top: 0; }

    .drawer-info-row {
      display: flex; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .drawer-info-label { color: var(--text2); }
    .drawer-info-value { color: var(--text); font-weight: 600; }

    .drawer-member-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px;
      margin-bottom: 8px; display: flex;
      align-items: center; gap: 12px;
    }

    .drawer-member-card .member-avatar { width: 36px; height: 36px; font-size: 12px; }

    .drawer-member-info { flex: 1; }
    .drawer-member-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .drawer-member-email { font-size: 12px; color: var(--muted); }

    .drawer-member-actions {
      display: flex; gap: 4px;
    }

    .drawer-action-btn {
      width: 30px; height: 30px; border-radius: 7px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--muted); font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s;
    }

    .drawer-action-btn:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-dim); }
    .drawer-action-btn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }
    .drawer-action-btn.retry:hover { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }

    .drawer-footer {
      padding: 16px 24px; border-top: 1px solid var(--border);
      display: flex; gap: 8px;
    }

    .drawer-btn {
      padding: 10px 20px; border-radius: 8px; font-size: 13px;
      font-weight: 600; font-family: inherit; cursor: pointer;
      border: none; transition: all 0.15s;
    }

    .drawer-btn.primary { background: var(--brand); color: #fff; flex: 1; }
    .drawer-btn.primary:hover { background: var(--brand-dark); }
    .drawer-btn.secondary { background: var(--surface); color: var(--text2); }
    .drawer-btn.secondary:hover { background: var(--border); }
    .drawer-btn.danger { background: var(--red-dim); color: var(--red); }
    .drawer-btn.danger:hover { background: var(--red); color: #fff; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--text); color: #fff; padding: 12px 20px;
      border-radius: 10px; font-size: 13px; font-weight: 600;
      font-family: 'Sora', sans-serif;
      box-shadow: var(--shadow-md);
      z-index: 800; transition: transform 0.3s ease;
      display: flex; align-items: center; gap: 8px;
    }

    .toast.visible { transform: translateX(-50%) translateY(0); }
    .toast.success { border-left: 4px solid var(--sage-dark); }
    .toast.error { border-left: 4px solid var(--red); }
    .toast.info { border-left: 4px solid var(--brand); }

    /* ── Animations ── */
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ── Responsive — mobile-first ── */
    @media (max-width: 640px) {
      .topbar { padding: 0 16px; }
      .sub-nav { padding: 0 12px; }
      .page-title { font-size: 20px; }
      .page-header { flex-direction: column; }
      .stats-strip { width: 100%; flex-direction: column; }
      .stat-card { flex: 1; min-width: unset; }
      .filters-bar { flex-direction: column; align-items: stretch; }
      .filter-select, .filter-search { width: 100%; min-width: unset; }
      .drawer { width: 100vw; }
      .sub-indent { padding-left: 24px; }
      .members-tbl th:nth-child(3),
      .members-tbl td:nth-child(3),
      .members-tbl th:nth-child(5),
      .members-tbl td:nth-child(5) { display: none; }
    }

    @media (min-width: 641px) and (max-width: 768px) {
      .page-header { flex-direction: column; }
      .stats-strip { width: 100%; }
      .stat-card { flex: 1; }
      .filter-search { min-width: 160px; }
      .drawer { width: 100vw; }
    }

    @media (min-width: 769px) {
      .topbar { padding: 0 28px; }
      .sub-nav { padding: 0 24px; }
      .dash-content { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="logo">
      <svg class="logo-mark" width="26" height="26" viewBox="0 0 28 28" fill="none">
        <rect x="5" y="13" width="18" height="13" rx="3" fill="var(--brand-dim)" stroke="var(--brand)" stroke-width="1.5"/>

  <script>
    // ═══════════════════════════════════════

      { id: 'm012', firstName: 'Ryan', lastName: 'Wilson', email: 'ryan@example.com', phone: '+1 (555) 300-0005', planId: 'plan-002', role: 'sub', status: 'suspended', addedDate: 'Mar 5, 2026', holderId: 'm008' },

      { id: 'm014', firstName: 'Grace', lastName: 'Park', email: 'grace@example.com', phone: '+1 (555) 400-0002', planId: 'plan-003', role: 'sub', status: 'active', addedDate: 'Mar 1, 2026', holderId: 'm013' },
      // Couples Premium — Lisa's group
      { id: 'm015', firstName: 'Lisa', lastName: 'Nguyen', email: 'lisa@example.com', phone: '+1 (555) 500-0001', planId: 'plan-003', role: 'holder', status: 'active', addedDate: 'Mar 8, 2026', holderId: null },

      // Individual Monthly (single members)
      { id: 'm017', firstName: 'Alex', lastName: 'Morgan', email: 'alex.m@example.com', phone: '+1 (555) 600-0001', planId: 'plan-001', role: 'holder', status: 'active', addedDate: 'Jan 15, 2026', holderId: null },
      { id: 'm018', firstName: 'Jordan', lastName: 'Blake', email: 'jordan@example.com', phone: '+1 (555) 600-0002', planId: 'plan-001', role: 'holder', status: 'active', addedDate: 'Feb 1, 2026', holderId: null },
      { id: 'm019', firstName: 'Amber', lastName: 'Knox', email: 'amber@example.com', phone: '+1 (555) 600-0003', planId: 'plan-001', role: 'holder', status: 'failed', addedDate: 'Mar 27, 2026', holderId: null },
      // Premium Annual
      { id: 'm020', firstName: 'Chris', lastName: 'Martin', email: 'chris@example.com', phone: '+1 (555) 700-0001', planId: 'plan-004', role: 'holder', status: 'active', addedDate: 'Jan 5, 2026', holderId: null },
    ];

    // Track which holder groups are expanded
    var expandedHolders = {};

    // URL param simulation — for deep linking from plan setup
    var urlParams = new URLSearchParams(window.location.search);
    var prefilterPlan = urlParams.get('plan') || '';
    var prefilterHolder = urlParams.get('holder') || '';

    // ═══════════════════════════════════════
    // Nav
    // ═══════════════════════════════════════

    function getNavTabs() {
      var failedCount = allMembers.filter(function(m) { return m.status === 'failed'; }).length;
      var unlinkedPlans = 1; // Studio Pass from plan setup
      var healthIssues = 2;

      return [
        { label: 'Overview', href: 'dashboard-final.html', badge: 0, active: false },
        { label: 'Members', href: 'operator_members_page.html', badge: failedCount, active: true },
        { label: 'Plan Mapping', href: 'operator_plan_setup_dashboard.html', badge: unlinkedPlans, active: false },
        { label: 'Access', href: 'operator_access_dashboard.html', badge: 0, active: false },
        { label: platformName() + ' Config', href: '#', badge: 0, active: false },
        { label: 'Admin', href: 'operator_admin.html', badge: 0, active: false },
      ];
    }

    function renderNav() {
      var container = document.getElementById('subNav');
      container.innerHTML = '';
      getNavTabs().forEach(function(tab) {
        var a = document.createElement('a');
        a.href = tab.href;
        a.className = 'sub-nav-link' + (tab.active ? ' active' : '');
        a.textContent = tab.label;
        if (tab.badge > 0) {
          var badge = document.createElement('span');
          badge.className = 'sub-nav-badge';
          badge.textContent = tab.badge;
          a.appendChild(badge);
        }
        container.appendChild(a);
      });
    }

    // ═══════════════════════════════════════
    // Stats
    // ═══════════════════════════════════════

    function renderStats() {
      var total = allMembers.length;
      var active = allMembers.filter(function(m) { return m.status === 'active'; }).length;
      var pending = allMembers.filter(function(m) { return m.status === 'pending'; }).length;
      var failed = allMembers.filter(function(m) { return m.status === 'failed'; }).length;

      var strip = document.getElementById('statsStrip');
      strip.innerHTML =
        '<div class="stat-card" data-filter="" onclick="filterByStatus(this)"><div class="stat-value">' + total + '</div><div class="stat-label">Total Members</div></div>' +
        '<div class="stat-card" data-filter="active" onclick="filterByStatus(this)"><div class="stat-value">' + active + '</div><div class="stat-label">Active</div></div>' +
        '<div class="stat-card" data-filter="pending" onclick="filterByStatus(this)"><div class="stat-value">' + pending + '</div><div class="stat-label">Pending</div></div>' +
        (failed > 0 ? '<div class="stat-card alert" data-filter="failed" onclick="filterByStatus(this)"><div class="stat-value">' + failed + '</div><div class="stat-label">Failed</div></div>' : '');

      // Sync selected state with current filter
      syncStatCards();
    }

    function filterByStatus(card) {
      var status = card.getAttribute('data-filter');
      var sel = document.getElementById('filterStatus');

      // Toggle: if already filtering by this status, clear it
      if (sel.value === status) {
        sel.value = '';
      } else {
        sel.value = status;
      }
      applyFilters();
      syncStatCards();
    }

    function syncStatCards() {
      var current = document.getElementById('filterStatus').value;
      var cards = document.querySelectorAll('.stat-card');
      cards.forEach(function(c) {
        c.classList.toggle('selected', c.getAttribute('data-filter') === current);
      });
    }

    // ═══════════════════════════════════════
    // Filters
    // ═══════════════════════════════════════

    function buildPlanFilter() {
      var sel = document.getElementById('filterPlan');
      sel.innerHTML = '<option value="">All Plans</option>';
      plans.forEach(function(p) {
        var count = allMembers.filter(function(m) { return m.planId === p.id; }).length;
        sel.innerHTML += '<option value="' + p.id + '">' + p.name + ' (' + count + ')</option>';
      });
    }

    function getFiltered() {
      var planVal = document.getElementById('filterPlan').value;
      var statusVal = document.getElementById('filterStatus').value;
      var roleVal = document.getElementById('filterRole').value;
      var searchVal = document.getElementById('filterSearch').value.toLowerCase().trim();

      return allMembers.filter(function(m) {
        if (planVal && m.planId !== planVal) return false;
        if (statusVal && m.status !== statusVal) return false;
        if (roleVal && m.role !== roleVal) return false;
        if (searchVal) {
          var full = (m.firstName + ' ' + m.lastName + ' ' + m.email).toLowerCase();
          if (full.indexOf(searchVal) === -1) return false;
        }
        return true;
      });
    }

    function applyFilters() {
      var filtered = getFiltered();
      var anyFilter = document.getElementById('filterPlan').value ||
                      document.getElementById('filterStatus').value ||
                      document.getElementById('filterRole').value ||
                      document.getElementById('filterSearch').value.trim();

      document.getElementById('filterClear').classList.toggle('visible', !!anyFilter);
      document.getElementById('filterCount').textContent = 'Showing ' + filtered.length + ' of ' + allMembers.length;

      // Active filter banner for holder pre-filter
      var banner = document.getElementById('activeFilterBanner');
      if (prefilterHolder) {
        var holder = allMembers.find(function(m) { return m.id === prefilterHolder; });
        if (holder) {
          document.getElementById('activeFilterText').innerHTML = 'Filtered to <strong>' + holder.firstName + ' ' + holder.lastName + '\'s</strong> plan group';
          banner.classList.add('visible');
        }
      } else {
        banner.classList.remove('visible');
      }

      renderTable(filtered);
      syncStatCards();
    }

    function clearFilters() {
      document.getElementById('filterPlan').value = '';
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterRole').value = '';
      document.getElementById('filterSearch').value = '';
      prefilterHolder = '';
      prefilterPlan = '';
      // Reset all groups to collapsed
      expandedHolders = {};
      applyFilters();
    }

    // ═══════════════════════════════════════
    // Table rendering
    // ═══════════════════════════════════════

    function renderTable(filtered) {
      var tbody = document.getElementById('membersBody');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="6">No members match your filters.</td></tr>';
        return;
      }

      // Auto-expand groups when search or filters are active
      var hasActiveFilter = document.getElementById('filterSearch').value.trim() ||
                            document.getElementById('filterStatus').value ||
                            document.getElementById('filterRole').value;
      if (hasActiveFilter) {
        filtered.forEach(function(m) {
          if (m.holderId) expandedHolders[m.holderId] = true;
          if (m.role === 'holder') expandedHolders[m.id] = true;
        });
      }

      // Group by holder for multi-member plans
      var rendered = {};

      // Sort: holders first, then subs grouped under their holder
      var sorted = [];
      var holders = filtered.filter(function(m) { return m.role === 'holder'; });
      holders.forEach(function(h) {
        sorted.push(h);
        var plan = plans.find(function(p) { return p.id === h.planId; });
        if (plan && plan.isMultiMember) {
          var subs = filtered.filter(function(m) { return m.holderId === h.id; });
          subs.forEach(function(s) { sorted.push(s); });
          subs.forEach(function(s) { rendered[s.id] = true; });
        }
      });
      // Add any subs whose holder wasn't in filtered
      filtered.forEach(function(m) {
        if (!rendered[m.id] && sorted.indexOf(m) === -1) sorted.push(m);
      });

      sorted.forEach(function(m) {
        var plan = plans.find(function(p) { return p.id === m.planId; });
        var isHolder = m.role === 'holder';
        var isSub = m.role === 'sub';
        var isMultiPlan = plan && plan.isMultiMember;
        var initials = m.firstName[0] + m.lastName[0];
        var avatarClass = isHolder ? 'holder' : m.status;
        var subCount = allMembers.filter(function(s) { return s.holderId === m.id; }).length;
        var isExpanded = expandedHolders[m.id] === true; // default collapsed

        var tr = document.createElement('tr');
        if (isHolder) tr.className = 'is-holder';

        // If this is a sub and its holder is collapsed, hide it
        if (isSub && m.holderId) {
          var holderExpanded = expandedHolders[m.holderId] === true;
          if (!holderExpanded) {
            tr.style.display = 'none';
          }
          tr.setAttribute('data-holder', m.holderId);
        }

        // Member cell
        var memberCell = '<td><div class="member-cell">';
        if (isHolder && isMultiPlan && subCount > 0) {
          memberCell += '<button class="expand-btn' + (isExpanded ? ' open' : '') + '" onclick="toggleHolderExpand(\'' + m.id + '\', event)">&#9654;</button>';
        } else if (isSub) {
          memberCell += '<span class="sub-indent"><span class="sub-connector"></span></span>';
        }
        memberCell += '<div class="member-avatar ' + avatarClass + '">' + initials + '</div>';
        memberCell += '<div><div class="member-name">' + m.firstName + ' ' + m.lastName;
        if (isHolder && isMultiPlan) memberCell += '<span class="member-tag holder">Holder</span>';
        if (isSub) memberCell += '<span class="member-tag sub">Additional</span>';
        memberCell += '</div><div class="member-email">' + m.email + '</div></div>';
        memberCell += '</div></td>';

        // Plan cell — subs don't repeat the plan name
        var planCell = '<td>';
        if (isHolder) {
          planCell += '<div class="plan-badge">' + (plan ? plan.name : '—') + '</div>';
          if (isMultiPlan) {
            planCell += '<div class="plan-badge-sub">' + subCount + ' of ' + (plan.maxMembers - 1) + ' members</div>';
          }
        }
        planCell += '</td>';

        // Role cell
        var roleCell = '<td>' + (isHolder ? 'Plan Holder' : 'Additional Member') + '</td>';

        // Status cell
        var statusCell = '<td><span class="status-pill ' + m.status + '"><span class="status-dot"></span>' +
          m.status.charAt(0).toUpperCase() + m.status.slice(1) + '</span></td>';

        // Date cell
        var dateCell = '<td style="font-size:12px;color:#9aa5b4;">' + m.addedDate + '</td>';

        // Actions cell
        var actionsCell = '<td style="text-align:right;">';
        if (isHolder && isMultiPlan) {
          actionsCell += '<button class="tbl-action-btn" onclick="openDrawer(\'' + m.id + '\')" title="Edit members">&#9998;</button>';
        }
        if (m.status === 'failed') {
          actionsCell += '<button class="tbl-action-btn retry" onclick="retryMember(\'' + m.id + '\')" title="Retry access">&#8635;</button>';
        }
        actionsCell += '</td>';

        tr.innerHTML = memberCell + planCell + roleCell + statusCell + dateCell + actionsCell;
        tbody.appendChild(tr);
      });
    }

    function toggleHolderExpand(holderId, event) {
      event.stopPropagation();
      var current = expandedHolders[holderId] !== false;
      expandedHolders[holderId] = !current;

      // Toggle sub rows
      var rows = document.querySelectorAll('tr[data-holder="' + holderId + '"]');
      rows.forEach(function(row) {
        row.style.display = current ? 'none' : '';
      });

      // Toggle button
      var btn = event.target.closest('.expand-btn');
      if (btn) btn.classList.toggle('open');
    }

    // ═══════════════════════════════════════
    // Detail drawer
    // ═══════════════════════════════════════

    function openDrawer(holderId) {
      var holder = allMembers.find(function(m) { return m.id === holderId; });
      if (!holder) return;

      var plan = plans.find(function(p) { return p.id === holder.planId; });
      var subs = allMembers.filter(function(m) { return m.holderId === holderId; });

      document.getElementById('drawerTitle').textContent = holder.firstName + ' ' + holder.lastName + '\'s Plan Group';

      var body = '';

      // Holder info
      body += '<div class="drawer-section-label">Plan Holder</div>';
      body += '<div class="drawer-member-card">';
      body += '<div class="member-avatar holder">' + holder.firstName[0] + holder.lastName[0] + '</div>';
      body += '<div class="drawer-member-info"><div class="drawer-member-name">' + holder.firstName + ' ' + holder.lastName + '</div><div class="drawer-member-email">' + holder.email + '</div></div>';
      body += '<span class="status-pill ' + holder.status + '"><span class="status-dot"></span>' + holder.status.charAt(0).toUpperCase() + holder.status.slice(1) + '</span>';
      body += '</div>';

      // Plan info
      body += '<div class="drawer-section-label">Plan Details</div>';
      body += '<div class="drawer-info-row"><span class="drawer-info-label">Plan</span><span class="drawer-info-value">' + (plan ? plan.name : '—') + '</span></div>';
      body += '<div class="drawer-info-row"><span class="drawer-info-label">Members</span><span class="drawer-info-value">' + (subs.length + 1) + ' / ' + (plan ? plan.maxMembers : '—') + '</span></div>';
      body += '<div class="drawer-info-row"><span class="drawer-info-label">Member since</span><span class="drawer-info-value">' + holder.addedDate + '</span></div>';
      body += '<div class="drawer-info-row"><span class="drawer-info-label">Phone</span><span class="drawer-info-value">' + holder.phone + '</span></div>';

      // Additional members
      body += '<div class="drawer-section-label">Additional Members (' + subs.length + ' of ' + (plan ? plan.maxMembers - 1 : '—') + ')</div>';

      if (subs.length === 0) {
        body += '<div style="text-align:center;padding:20px;color:#9aa5b4;font-size:13px;">No additional members added yet.</div>';
      } else {
        subs.forEach(function(s) {
          var initials = s.firstName[0] + s.lastName[0];
          body += '<div class="drawer-member-card">';
          body += '<div class="member-avatar ' + s.status + '">' + initials + '</div>';
          body += '<div class="drawer-member-info"><div class="drawer-member-name">' + s.firstName + ' ' + s.lastName + '</div><div class="drawer-member-email">' + s.email + ' · ' + s.phone + '</div></div>';
          body += '<div class="drawer-member-actions">';
          body += '<span class="status-pill ' + s.status + '" style="margin-right:4px;"><span class="status-dot"></span>' + s.status.charAt(0).toUpperCase() + s.status.slice(1) + '</span>';
          if (s.status === 'failed') {
            body += '<button class="drawer-action-btn retry" onclick="retryMember(\'' + s.id + '\')" title="Retry">&#8635;</button>';
          }
          body += '</div>';
          body += '</div>';
        });
      }

      document.getElementById('drawerBody').innerHTML = body;

      // Footer
      document.getElementById('drawerFooter').innerHTML =
        '<button class="drawer-btn secondary" onclick="closeDrawer()">Close</button>' +
        '<button class="drawer-btn primary" onclick="showToast(\'info\', \'Opening editor for ' + holder.firstName + '\\\'s members...\')">Edit Members</button>';

      document.getElementById('drawerOverlay').classList.add('visible');
      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
      setTimeout(function() {
        document.getElementById('drawerOverlay').classList.remove('visible');
      }, 250);
    }

    // ═══════════════════════════════════════
    // Actions
    // ═══════════════════════════════════════

    function retryMember(memberId) {
      var m = allMembers.find(function(x) { return x.id === memberId; });
      if (!m || m.status !== 'failed') return;
      m.status = 'pending';
      renderStats();
      renderNav();
      applyFilters();
      showToast('info', 'Retrying access for ' + m.firstName + '...');
      setTimeout(function() {
        m.status = 'active';
        renderStats();
        renderNav();
        applyFilters();
        showToast('success', m.firstName + ' now has access');
      }, 2500);
    }

    // ═══════════════════════════════════════
    // Toast
    // ═══════════════════════════════════════

    var toastTimer;
    function showToast(type, msg) {
      var t = document.getElementById('toast');
      var icons = { success: '&#10003;', error: '&#10005;', info: '&#8505;' };
      t.className = 'toast ' + type;
      t.innerHTML = (icons[type] || '') + ' ' + msg;
      t.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { t.classList.remove('visible'); }, 3500);
    }

    // ═══════════════════════════════════════
    // Dark mode
    // ═══════════════════════════════════════

    function toggleMode() {
      var html = document.documentElement;
      var isDark = html.getAttribute('data-mode') === 'dark';
      html.setAttribute('data-mode', isDark ? 'light' : 'dark');
    }

    // ═══════════════════════════════════════
    // Init
    // ═══════════════════════════════════════

    function init() {
      renderNav();
      renderStats();
      buildPlanFilter();

      document.getElementById('pageSubtitle').textContent = 'All members across your plans. View access status, manage additional members, and resolve provisioning issues.';

      // Apply pre-filter from URL params (deep link from plan setup)
      if (prefilterPlan) {
        document.getElementById('filterPlan').value = prefilterPlan;
      }
      if (prefilterHolder) {
        // Find the holder's plan and filter to it
        var holder = allMembers.find(function(m) { return m.id === prefilterHolder; });
        if (holder) {
          document.getElementById('filterPlan').value = holder.planId;
          expandedHolders[prefilterHolder] = true;
        }
      }

      applyFilters();

      // If deep-linked to a specific holder, auto-open the drawer
      if (prefilterHolder) {
        setTimeout(function() { openDrawer(prefilterHolder); }, 400);
      }
    }

    init();
  </script>
</body>
</html>
